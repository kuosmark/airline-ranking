@let airline = operator();
<app-aircraft-group-details [aircraft]="airline" [groupId]="airline.id" [groupName]="airline.name"
  [isShowingAllTypes]="isShowingAllTypes()" (typesToggled)="typesToggled.emit()">
  <dl class="operator-details" aria-label="Operator details">
    <div>
      <dt>Country</dt>
      <dd>
        @if (airline.country && countryFlag(airline.countryIso); as flag) {
          <span class="country-flag" aria-hidden="true">{{ flag }}</span>
        }
        {{ airline.country || 'Unavailable' }}
      </dd>
    </div>
    <div>
      <dt>IATA</dt>
      <dd>{{ airline.iata || 'Unavailable' }}</dd>
    </div>
    <div>
      <dt>ICAO</dt>
      <dd>{{ airline.icao || 'Unavailable' }}</dd>
    </div>
  </dl>
</app-aircraft-group-details>
