@let group = aircraft();
<div class="details-panel">
  <ng-content />
  @if (descriptions(); as reported) {
    <app-aircraft-breakdown [count]="group.count" heading="Reported aircraft descriptions"
      [breakdown]="reported" breakdownLabel="descriptions" [groupId]="groupId() + '-descriptions'" [groupName]="groupName()"
      [isShowingAllTypes]="isShowingAllDescriptions()" (typesToggled)="isShowingAllDescriptions.set(!isShowingAllDescriptions())" />
  }
  <app-aircraft-breakdown [count]="group.count" [heading]="heading()" [breakdown]="breakdown()"
    [breakdownLabel]="breakdownLabel()" [groupId]="groupId()" [groupName]="groupName()"
    [isShowingAllTypes]="isShowingAllTypes()" (typesToggled)="typesToggled.emit()" />
  @if (group.positions; as positions) {
    <app-aircraft-map [positions]="positions" [count]="group.count" />
  }
</div>
