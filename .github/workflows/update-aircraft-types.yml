name: Update aircraft reference

on:
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-aircraft-types
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download and validate reference
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/Mictronics/aircraft-database/main/indexedDB.zip \
            --output "$RUNNER_TEMP/mictronics.zip"
          node --experimental-strip-types scripts/update-aircraft-types.ts "$RUNNER_TEMP/mictronics.zip"
      - name: Detect changes
        id: changes
        run: |
          if ! git diff --quiet -- backend/data/mictronics-aircraft-types.json backend/data/mictronics-aircraft.json backend/data/mictronics-aircraft-classifications.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm run check
      - name: Prepare pull request description
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          let text = readFileSync('.github/pull_request_template.md', 'utf8');
          text = text.replace('Describe the problem and resulting behavior.',
              'Refresh bundled aircraft type names and ICAO24 reference records from Mictronics. No runtime requests are added.');
          text = text.replace('List commands and results, plus relevant manual checks or screenshots. For UI changes, record the tested viewport widths and verify wrapping, overflow, spacing, and changed interactions.',
              'The importer validated the data and unchanged licence. npm run check passed in the update workflow. Inspect changed names in the UI before merging.');
          text = text.replace('Summarize the review approach, findings, resolutions, and any remaining limitations.',
              'Human review is pending. Compare added, removed and changed type codes and aircraft records with the upstream export. Approve the PR workflows if GitHub requests it, and confirm checks pass for this revision.');
          writeFileSync('/tmp/type-update-pr.md', text);
          JS
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/update-aircraft-types
          delete-branch: true
          add-paths: |
            backend/data/mictronics-aircraft-types.json
            backend/data/mictronics-aircraft-classifications.json
            backend/data/mictronics-aircraft.json
          commit-message: Refresh Mictronics aircraft reference
          title: Refresh Mictronics aircraft reference
          body-path: /tmp/type-update-pr.md
